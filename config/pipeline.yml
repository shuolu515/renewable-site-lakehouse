project:
  name: renewable-site-lakehouse
  region: limburg_weilburg_rural_mvp

region:
  # Complete parcel snapshot boundary: min_lon, min_lat, max_lon, max_lat
  bbox: [8.15, 50.425, 8.175, 50.45]
  # Expanded search boundary for grid proxies within roughly 7 km of the parcel area
  grid_bbox: [8.05, 50.36, 8.275, 50.515]
  parcel_page_size: 200
  max_parcels: 1000
  max_grid_assets: 500

quality:
  minimum_area_m2: 20000
  maximum_grid_distance_m: 7000
  allowed_geometry_types:
    - Polygon
    - MultiPolygon

scoring:
  weights:
    grid: 0.40
    land: 0.35
    data_quality: 0.15
    planning: 0.10
  default_planning_score: 50
  capacity_status_default: unknown

